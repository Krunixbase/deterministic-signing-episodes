<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg">

  <!-- DARK BADGE BACKGROUND -->
  <rect x="0" y="0" width="420" height="120" rx="18" fill="#000000"/>

  <!-- ICON HEXAGON -->
  <polygon
    points="60,20 110,50 110,100 60,130 10,100 10,50"
    transform="scale(0.7) translate(20,10)"
    stroke="#00FF88"
    stroke-width="8"
    fill="none"
    stroke-linejoin="round"
  />

  <!-- ICON NODES -->
  <circle cx="95" cy="45" r="8" fill="#00FF88"/>
  <circle cx="70" cy="80" r="8" fill="#00FF88"/>
  <circle cx="120" cy="80" r="8" fill="#00FF88"/>

  <!-- ICON CONNECTIONS -->
  <line x1="95" y1="45" x2="70" y2="80"
        stroke="#00FF88" stroke-width="6" stroke-linecap="round"/>
  <line x1="95" y1="45" x2="120" y2="80"
        stroke="#00FF88" stroke-width="6" stroke-linecap="round"/>
  <line x1="70" y1="80" x2="120" y2="80"
        stroke="#00FF88" stroke-width="6" stroke-linecap="round"/>

  <!-- TEXT -->
  <text x="160" y="72"
        font-family="Inter, sans-serif"
        font-size="32"
        fill="#FFFFFF"
        font-weight="600">
    Deterministic
  </text>

</svg>