<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- BACKGROUND (VISIBLE ON GITHUB) -->
  <rect width="512" height="512" fill="#0A0A0A"/>

  <!-- HEXAGON OUTLINE -->
  <polygon
    points="256,32 448,160 448,352 256,480 64,352 64,160"
    stroke="#FFFFFF"
    stroke-width="24"
    fill="none"
    stroke-linejoin="round"
  />

  <!-- DETERMINISTIC EPISODE NODES -->
  <circle cx="256" cy="180" r="22" fill="#FFFFFF"/>
  <circle cx="180" cy="300" r="22" fill="#FFFFFF"/>
  <circle cx="332" cy="300" r="22" fill="#FFFFFF"/>

  <!-- DETERMINISTIC CONNECTIONS -->
  <line x1="256" y1="180" x2="180" y2="300"
        stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>

  <line x1="256" y1="180" x2="332" y2="300"
        stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>

  <line x1="180" y1="300" x2="332" y2="300"
        stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>

</svg>
